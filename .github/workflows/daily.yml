name: daily-fetch

on:
  schedule:
    - cron: '40 6 * * 1-5'   # 평일 15:40 KST (장 마감 뒤)
  workflow_dispatch: {}      # Actions 탭에서 'Run workflow'로 직접 실행

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 실제 조회 (비밀키 없음)
        run: node scripts/fetch-daily.js
      - name: 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 조회"
          git push
